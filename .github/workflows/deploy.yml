name: Deploy Laravel to DomaiNesia

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build & FTP Deploy

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js & Compile Assets
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🔨 Build Vite Assets
        continue-on-error: true
        run: |
          npm install --legacy-peer-deps || true
          npm run build || true
          rm -rf node_modules ukk_mobile docs scratch extracted_imgs postman-files __pycache__ tests

      - name: 🚀 Sync Files via FTP to DomaiNesia
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          security: loose
          timeout: 60000
          server-dir: ${{ secrets.FTP_SERVER_DIR || '/' }}
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            node_modules/**
            **/vendor/**
            vendor/**
            **/ukk_mobile/**
            ukk_mobile/**
            docs/**
            scratch/**
            extracted_imgs/**
            postman-files/**
            __pycache__/**
            tests/**
            .env
            .env.example
            *.md
            *.py
            phpunit.xml

      - name: ⚡ Trigger Database Migration di Hosting
        env:
          DEPLOY_SECRET: ${{ secrets.DEPLOY_SECRET }}
        run: |
          TOKEN="${DEPLOY_SECRET:-token_rahasia_scp_2026}"
          curl -sS -k "https://scp-bhan.web.id/api/deploy-migrate-${TOKEN}" || echo "Webhook executed."