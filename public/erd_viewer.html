<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERD Database - School Class Progress</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #0F172A;
            color: #F8FAFC;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        header {
            background-color: #1E293B;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        .header-title h1 {
            font-size: 1.15rem;
            font-weight: 700;
            color: #FFFFFF;
        }
        .header-title p {
            font-size: 0.8rem;
            color: #94A3B8;
            margin-top: 2px;
        }
        .btn-download {
            background: linear-gradient(135deg, #4F46E5, #06B6D4);
            color: #FFFFFF;
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.875rem;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
            transition: all 0.2s;
        }
        .btn-download:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.45);
        }
        .main-container {
            flex: 1;
            padding: 24px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow: auto;
        }
        .img-card {
            background: #FFFFFF;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            max-width: 100%;
        }
        .img-card img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>Diagram ERD Database (Entity Relationship Diagram)</h1>
            <p>School Class Progress • UKK Project (Laravel 11 & Flutter)</p>
        </div>
        <div>
            <a href="images/erd_database.png" download="ERD_Database_School_Class_Progress.png" class="btn-download">
                <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
                </svg>
                Download Gambar ERD (PNG Resolusi Tinggi)
            </a>
        </div>
    </header>

    <div class="main-container">
        <div class="img-card">
            <img src="images/erd_database.png" alt="ERD Database School Class Progress">
        </div>
    </div>
</body>
</html>
